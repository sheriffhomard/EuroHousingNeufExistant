<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="108" fill="url(#bg)" />

  <!-- Grid lines subtle -->
  <line x1="80" y1="360" x2="432" y2="360" stroke="#334155" stroke-width="2" stroke-dasharray="6,6" opacity="0.6"/>
  <line x1="80" y1="280" x2="432" y2="280" stroke="#334155" stroke-width="2" stroke-dasharray="6,6" opacity="0.6"/>
  <line x1="80" y1="200" x2="432" y2="200" stroke="#334155" stroke-width="2" stroke-dasharray="6,6" opacity="0.6"/>

  <!-- Housing outline -->
  <path d="M 120 280 L 256 160 L 392 280 V 380 H 120 Z" fill="none" stroke="url(#cyan)" stroke-width="14" stroke-linejoin="round" />
  <path d="M 220 380 V 290 H 292 V 380" fill="none" stroke="url(#cyan)" stroke-width="10" stroke-linejoin="round" />

  <!-- Trend graph line surging through the house -->
  <polyline points="90,370 170,330 250,260 330,220 420,130" fill="none" stroke="url(#gold)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Observatory Euro Stars arc -->
  <circle cx="256" cy="110" r="8" fill="#fbbf24" />
  <circle cx="210" cy="120" r="6" fill="#fbbf24" opacity="0.85" />
  <circle cx="302" cy="120" r="6" fill="#fbbf24" opacity="0.85" />
  <circle cx="170" cy="145" r="5" fill="#fbbf24" opacity="0.7" />
  <circle cx="342" cy="145" r="5" fill="#fbbf24" opacity="0.7" />

  <!-- Active node point -->
  <circle cx="420" cy="130" r="14" fill="#fbbf24" />
  <circle cx="420" cy="130" r="22" fill="#fbbf24" opacity="0.3" />
</svg>
